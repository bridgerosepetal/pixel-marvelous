<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collections</title>
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <header class="top">
    <svg class="mark" viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
      <rect class="mark-back" x="1.75" y="1.75" width="10.5" height="10.5" rx="2.25"/>
      <rect class="mark-front" x="5.75" y="5.75" width="10.5" height="10.5" rx="2.25"/>
    </svg>
    <h1>Collections</h1>
    <button class="btn" id="connect" title="Connect a folder from your computer">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      Folder
    </button>
  </header>

  <main id="collections"></main>

  <footer class="bottom">
    <span class="target" id="target">No page selected</span>
  </footer>

  <div class="status" id="status" role="status"></div>

  <script src="library.js"></script>
</body>
</html>
